# Render Blueprint Specification for AgriStress Analytics
services:
  - type: web
    name: agristress-analytics-api
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python scripts/init_db.py && python scripts/generate_demo_data.py && python scripts/import_data.py --all"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        value: sqlite:///./agristress.db
      - key: DATA_DIR
        value: data
      - key: OUTPUTS_DIR
        value: outputs
    healthCheckPath: /health
